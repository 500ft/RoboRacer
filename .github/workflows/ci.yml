name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  evidence-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Python 3.10
      uses: actions/setup-python@v6
      with:
        python-version: "3.10"

    - name: Install evidence-test dependencies
      run: |
        python -m pip install -r requirements-item11-regression.txt
        python -m pip install -r requirements-report.txt

    - name: Run evidence tests
      env:
        PYTHONPATH: gym
      run: |
        python experiments/test_rosbag_to_telemetry.py
        python experiments/test_bag_evidence.py
        python experiments/validate_item11.py
        python experiments/test_mast_physical_validation.py
        python experiments/test_final_report.py
